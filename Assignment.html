<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ayan shahid</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: #f0f4f3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 660px;
    min-height: 390px;
    display: flex;
    background: white;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    overflow: hidden;
}

/* Sign In Section */
.signin {
    width: 50%;
    padding: 48px 43px;
    text-align: center;
    background: #fff;
}

.signin h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #111;
}

.social-icons {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
}

.social-icons a {
    width: 34px;
    height: 34px;
    border: 1px solid #eee;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    color: #4267a9;
    transition: 0.3s;
}

.social-icons a:nth-child(2) {
    color: #db4437;
}

.social-icons a:nth-child(3) {
    color: #0077b5;
}

.social-icons a:hover {
    background: #f0f0f0;
    transform: translateY(-3px);
}

.account-text {
    font-size: 11px;
    color: #555;
    margin-bottom: 7px;
}

.signin input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 12px;
    border: none;
    outline: none;
    background: #e9edf2;
    font-size: 12px;
}

.forgot {
    display: block;
    margin: 7px 0 14px;
    color: #555;
    font-size: 12px;
    text-decoration: none;
}

button {
    border: 1px solid #ff4b2b;
    border-radius: 25px;
    padding: 10px 38px;
    background: #ff4b2b;
    color: white;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
}

.signin button:hover {
    background: #e93e20;
}

/* Sign Up Section */
.signup {
    width: 50%;
    background: linear-gradient(120deg, #ff3d2e, #ff3024);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

.signup h1 {
    font-size: 27px;
    margin-bottom: 16px;
}

.signup p {
    font-size: 12px;
    line-height: 19px;
    color: #ffe1dc;
    margin-bottom: 24px;
}

.signup button {
    background: transparent;
    border-color: #ffaaa0;
    min-width: 126px;
}

.signup button:hover {
    background: white;
    color: #ff3d2e;
}

/* Mobile Responsive */
@media (max-width: 600px) {
    .container {
        width: 92%;
        flex-direction: column;
    }

    .signin,
    .signup {
        width: 100%;
        padding: 35px 25px;
    }

    .signup {
        min-height: 240px;
    }
}
        </style>
</head>
<body>

    <div class="container">

        <!-- Left Side: Sign In -->
        <div class="signin">
            <h1>Sign in</h1>

            <div class="social-icons">
                <a href="#">f</a>
                <a href="#">G+</a>
                <a href="#">in</a>
            </div>

            <p class="account-text">or use your account</p>

            <form>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>

                <a href="#" class="forgot">Forgot your password?</a>

                <button type="submit">SIGN IN</button>
            </form>
        </div>

        <!-- Right Side: Sign Up -->
        <div class="signup">
            <h1>Hello, Friend!</h1>

            <p>
                Enter your personal details and start
                <br>
                journey with us
            </p>

            <button type="button">SIGN UP</button>
        </div>

    </div>

</body>
</html>
